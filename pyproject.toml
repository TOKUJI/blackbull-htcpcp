[project]
name = "blackbull-htcpcp"
# ZeroVer (0.MINOR.PATCH).  Alpha suffix (aN) used during the TestPyPI
# rehearsal cycle; first stable cut will be 0.1.0.
version = "0.1.0"
description = "HTCPCP (RFC 2324 + RFC 7168) extension for the BlackBull ASGI framework."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "TOKUJI" }
]

license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = ["asgi", "blackbull", "htcpcp", "coffee", "teapot", "rfc2324", "rfc7168"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# The extension uses the `init_app(app)` convention plus the
# `app.extensions` dict (landed in BlackBull 0.36.0), `app.on_error`,
# `app.route`, `app.use`, and `read_body`.  All of those are stable
# public APIs as of BlackBull 0.42.0.
dependencies = [
    "blackbull >= 0.36.0",
]

[project.urls]
Homepage = "https://github.com/TOKUJI/blackbull-htcpcp"
Repository = "https://github.com/TOKUJI/blackbull-htcpcp"
Changelog = "https://github.com/TOKUJI/blackbull-htcpcp/blob/master/CHANGELOG.md"
Issues = "https://github.com/TOKUJI/blackbull-htcpcp/issues"
"BlackBull framework" = "https://github.com/TOKUJI/BlackBull"

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-asyncio",
    "blackbull[testing] >= 0.36.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks acceptance tests that exercise the extension end-to-end through TestClient",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561 — distribute inline type hints to downstream type-checkers.
blackbull_htcpcp = ["py.typed"]

[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"
